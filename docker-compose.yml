services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: gobernanza-login-app
    env_file:
      - .env.docker
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gobernanza-login

  nginx:
    image: nginx:1.27-alpine
    container_name: gobernanza-login-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gobernanza-login

  mysql:
    image: mysql:8.4
    container_name: gobernanza-login-mysql
    environment:
      MYSQL_DATABASE: gobernanza_login
      MYSQL_USER: gobernanza
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gobernanza-login

  node:
    image: node:22-alpine
    container_name: gobernanza-login-node
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www
    networks:
      - gobernanza-login

volumes:
  mysql-data:

networks:
  gobernanza-login:
    driver: bridge
